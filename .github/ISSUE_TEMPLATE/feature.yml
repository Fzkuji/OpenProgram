name: Feature request
description: Propose a concrete OpenProgram use case or capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to accomplish, and who needs it?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current limitation
      description: What currently prevents or complicates this use case?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable behavior that would solve the use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List existing OpenProgram features or external tools you evaluated.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
