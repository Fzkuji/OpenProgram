name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install and enable bubblewrap
        # Ubuntu 24.04 restricts unprivileged user namespaces through
        # AppArmor; bwrap needs them to exercise the real Linux sandbox.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/integration

  docs-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and docs build dependencies
        run: pip install -e . markdown-it-py mdit-py-plugins pygments
      - name: Build docs site
        run: python -m tools.docs_site.build
      - name: Check docs links
        run: python -m tools.docs_site.checklinks
      - name: Examples smoke (offline embedding)
        run: python examples/embed_in_your_stack.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: Build frontend
        run: npx next build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Frontend contracts
        run: npm run check
        working-directory: web
      - name: Check desktop web tab navigation
        run: node desktop/scripts/check-webtab-navigation.js
