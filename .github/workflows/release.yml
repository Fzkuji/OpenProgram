name: Release

# Started only by hand: publish-github.sh --tag vX.Y.0 dispatches it once the
# tag is pushed, and a rehearsal is dispatched the same way. Pushing a tag
# starts nothing; a code-only release (vX.Y.Z, vX.Y.Z.W) never runs it.
#
# Every published update carries a runtime layer per platform for its base;
# the runtime-layer job uploads them to the `updates` release (not on a
# rehearsal). When a daily publish is refused because the base changed,
# runtime_layers_only builds and uploads just those layers from the dispatched
# ref, with no tag, installer or release page:
#   gh workflow run release.yml -R Fzkuji/OpenProgram --ref main -f runtime_layers_only=true
#
# Each signed macOS App, the Windows App and the Linux AppImage also become a
# shell layer, uploaded by the desktop leg once its App passed its checks, so
# installed Apps take a new shell from the update store instead of an installer. A rehearsal builds them
# without uploading. `publish-updates.py announce vX.Y.0` refuses until there
# is one for every App the release published that replaces itself (read from
# its release-manifest.json); a platform without one keeps the installer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Feature release tag (vX.Y.0); an existing one, or with rehearse the one about to be made. Not used with runtime_layers_only
        required: false
        type: string
        default: ""
      rehearse:
        description: Build and check everything from this branch without publishing; the tag need not exist
        required: false
        type: boolean
        default: false
      runtime_layers_only:
        description: Only build and upload each platform's runtime layer from this branch; no tag, installers or release page
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  # A rehearsal builds the commit it was started on, before its tag exists;
  # so do runtime layers on their own, which need no tag.
  RELEASE_REF: ${{ (inputs.rehearse || inputs.runtime_layers_only) && github.sha || inputs.tag }}

jobs:
  # The App downloads the pinned Office archive from its own version's release,
  # so every release carries it, once. It cannot be rebuilt here (its fonts and
  # editor build are the owner's inputs): the newest published release's copy is
  # carried forward, or for the first release the copy the owner put on the
  # tag's draft (scripts/release/office-archive.py seed). Without one, nothing
  # else runs.
  office:
    if: ${{ !inputs.runtime_layers_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.0$'; then
            echo "a release needs its feature release tag (vX.Y.0), not '$RELEASE_TAG'; runtime_layers_only needs none" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Fetch the Office archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(python scripts/release/office-archive.py name)"
          mkdir -p office-assets
          status=0
          python scripts/release/office-archive.py fetch "office-assets/$name" || status=$?
          if [ "$status" = 3 ]; then
            gh release download "$RELEASE_TAG" --pattern "$name" --dir office-assets || true
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          python scripts/release/office-archive.py verify "office-assets/$name" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: office-assets
          path: office-assets/*.zip
          compression-level: 0

  platforms:
    needs: office
    # Runtime layers on their own skip the Office archive; a release needs it.
    if: ${{ !cancelled() && (needs.office.result == 'success' || (inputs.runtime_layers_only && needs.office.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
      seed: ${{ steps.select.outputs.seed }}
      seed_count: ${{ steps.select.outputs.seed_count }}
      desktop: ${{ steps.select.outputs.desktop }}
      desktop_count: ${{ steps.select.outputs.desktop_count }}
      runtime_layers: ${{ steps.select.outputs.runtime_layers }}
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      # A key the released code does not trust is as good as none: an App built
      # against it could never accept an update.
      - name: Check the update signing key
        id: update-key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.OPENPROGRAM_UPDATE_SIGNING_KEY }}
        run: |
          trusted=false
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key_file="$RUNNER_TEMP/update-signing-key.pem"
            (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file")
            if public_key="$(uv run --no-project --with zstandard --with cryptography \
                python scripts/release/publish-updates.py public-key --signing-key "$key_file")" \
              && [ -n "$public_key" ] \
              && grep -qF "$public_key" openprogram/operations/self_update/official/signing.py \
              && grep -qF "$public_key" apps/desktop/main/self-update/update-service.js; then
              trusted=true
            else
              echo "::warning::The update signing key is not listed in RELEASE_PUBLIC_KEYS in both official/signing.py and update-service.js, so Apps that need it are left out."
            fi
            rm -f "$key_file"
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
      - name: Select release platforms
        id: select
        env:
          # Each leg is on unless its variable says false; these three are off
          # unless it says true. Credentials pick signed or unsigned builds.
          OPENPROGRAM_RELEASE_WINDOWS_RUNTIME: ${{ vars.OPENPROGRAM_RELEASE_WINDOWS_RUNTIME }}
          OPENPROGRAM_RELEASE_DESKTOP_MAC: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_MAC }}
          OPENPROGRAM_RELEASE_DESKTOP_WINDOWS: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_WINDOWS }}
          OPENPROGRAM_RELEASE_DESKTOP_LINUX: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_LINUX }}
          OPENPROGRAM_RELEASE_WINDOWS_ARM64: ${{ vars.OPENPROGRAM_RELEASE_WINDOWS_ARM64 }}
          OPENPROGRAM_RELEASE_MAC_THIN: ${{ vars.OPENPROGRAM_RELEASE_MAC_THIN }}
          OPENPROGRAM_RELEASE_CLI_SEEDS: ${{ vars.OPENPROGRAM_RELEASE_CLI_SEEDS }}
          OPENPROGRAM_MAC_SIGNING_AVAILABLE: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && vars.MAC_SIGNING_IDENTITY != '' }}
          OPENPROGRAM_WINDOWS_SIGNING_AVAILABLE: ${{ secrets.WINDOWS_CSC_LINK != '' && secrets.WINDOWS_CSC_KEY_PASSWORD != '' }}
          OPENPROGRAM_UPDATE_KEY_TRUSTED: ${{ steps.update-key.outputs.trusted }}
          OPENPROGRAM_RELEASE_RUNTIME_LAYERS_ONLY: ${{ inputs.runtime_layers_only }}
        run: python3 scripts/release/release-matrix.py select >> "$GITHUB_OUTPUT"

  python:
    if: ${{ !inputs.runtime_layers_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Build developer Python distributions
        run: |
          scripts/release/stage-release-assets.sh
          rm -rf build
          uv build
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/_frontend/index.html'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/server.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/routes/files/tree.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/ws_actions/webtab.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/cli/application.py'
          wheel_path="$(realpath "$(find dist -name 'openprogram-*.whl' -print -quit)")"
          checkout_path="$GITHUB_WORKSPACE"
          probe_dir="$(mktemp -d)"
          (cd "$probe_dir" && OPENPROGRAM_CHECKOUT="$checkout_path" uv run --with "$wheel_path" --no-project -- python -P -c 'from pathlib import Path; import os, openprogram, openprogram.interfaces.cli, openprogram.interfaces.server.server as server; import openprogram.interfaces.server.frontend as frontend; checkout = Path(os.environ["OPENPROGRAM_CHECKOUT"]).resolve(); modules = (openprogram, openprogram.interfaces.cli, server, frontend); assert all(not Path(module.__file__).resolve().is_relative_to(checkout) for module in modules); assert (frontend.out_dir() / "index.html").is_file(); assert openprogram.interfaces.cli.build_parser().prog == "openprogram"')
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram.interfaces.cli --version)
      - uses: actions/upload-artifact@v7
        with:
          name: developer-python-distributions
          path: dist/*

  product-runtime:
    needs: platforms
    if: ${{ !inputs.runtime_layers_only }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      # The embedded Tailscale sidecar (apps/tailnet) goes into the runtime.
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/tailnet/go.mod
          cache-dependency-path: apps/tailnet/go.sum
      - name: Verify version
        if: matrix.platform != 'windows'
        run: python3 scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Verify version on Windows
        if: matrix.platform == 'windows'
        run: python scripts/release/verify-release-version.py --tag "$env:RELEASE_TAG"
      # What this runner gave the build, so a failure below can be read from one run.
      - name: Show the Windows toolchain
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/release/show-windows-toolchain.ps1
      - name: Install Linux runtime test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1 libglib2.0-0
      # Every package the runtime installs has a wheel for this target's oldest
      # supported system, or is one of the few this leg builds from source.
      - name: Check the lock has every runtime wheel
        shell: bash
        run: >-
          uv run --no-project --python 3.12 --with packaging
          python scripts/release/runtime-wheels.py check
          --target "${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Prepare static OpenSSL for the Intel Mac runtime
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: scripts/release/prepare-macos-native-deps.sh
      - name: Build complete product runtime
        if: matrix.platform != 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a scripts/release/build-product-runtime.sh
          else
            scripts/release/build-product-runtime.sh
          fi
      - name: Prepare native Windows ARM64 OpenSSL
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: scripts/release/prepare-windows-native-deps.ps1 -Architecture arm64
      - name: Build complete Windows product runtime
        if: matrix.platform == 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: pwsh
        run: scripts/release/build-product-runtime.ps1
      - name: Verify Linux runtime on the Ubuntu 22.04 glibc baseline
        if: matrix.platform == 'linux'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: >-
          bash scripts/release/smoke-linux-runtime-baseline.sh
          "$OPENPROGRAM_RUNTIME_ROOT" "${{ matrix.arch }}"
      - name: Archive complete product runtime
        if: matrix.platform != 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        run: scripts/release/archive-product-runtime.sh
      - name: Archive complete Windows product runtime
        if: matrix.platform == 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: scripts/release/archive-product-runtime.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/*

  # Every published update carries a runtime layer for each platform in
  # publish.RUNTIME_PLATFORMS, for its base, whatever the installers here are.
  # Each leg builds the base exactly as a seed does (build-release-seed.sh;
  # on macOS its binaries are signed when the Apple secrets exist, as a seed's
  # are, and stay unsigned otherwise, as an unsigned seed's do), then uploads
  # the layer to the `updates` release beside the packs. No pointer moves:
  # publish-updates.py run or announce publishes it.
  runtime-layer:
    needs: platforms
    if: ${{ !cancelled() && needs.platforms.result == 'success' && !inputs.rehearse }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.runtime_layers) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/tailnet/go.mod
          cache-dependency-path: apps/tailnet/go.sum
      - name: Confirm zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            case "${{ matrix.platform }}" in
              linux) sudo apt-get update && sudo apt-get install --no-install-recommends --yes zstd ;;
              macos) brew install zstd ;;
              windows) choco install zstandard --yes --no-progress ;;
            esac
          fi
          zstd --version
      - name: Prepare static OpenSSL for the Intel Mac base
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: scripts/release/prepare-macos-native-deps.sh
      - name: Prepare macOS signing keychain
        if: matrix.signing == 'signed'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/ci-sign-macos.py setup
      - name: Build the base
        env:
          OPENPROGRAM_RELEASE_SIGN_IDENTITY: ${{ matrix.signing == 'signed' && vars.MAC_SIGNING_IDENTITY || '' }}
        run: bash scripts/release/build-release-seed.sh "$RUNNER_TEMP/layer-build"
      - name: Remove macOS signing keychain
        if: always() && matrix.signing == 'signed'
        run: python scripts/release/ci-sign-macos.py cleanup
      - name: Upload the runtime layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime="$RUNNER_TEMP/layer-build/store/runtime"
          bases=($(ls "$runtime/bases"))
          test "${#bases[@]}" = 1 || { echo "expected one base in the build's store, found: ${bases[*]}" >&2; exit 1; }
          base="$runtime/bases/${bases[0]}"
          # The base has no Tailscale sidecar of its own; the sealed version's goes in.
          tailnet=()
          for version in $(ls "$runtime/versions"); do
            for name in openprogram-tailnet openprogram-tailnet.exe; do
              if [ -f "$runtime/versions/$version/bin/$name" ] && [ ! -e "$base/bin/$name" ]; then
                tailnet=(--tailnet "$runtime/versions/$version/bin/$name")
              fi
            done
          done
          uv run --no-project --python 3.12 --with zstandard --with cryptography \
            python scripts/release/publish-updates.py upload-runtime-layer \
            --base "$base" --platform "${{ matrix.platform }}-${{ matrix.arch }}" ${tailnet[@]+"${tailnet[@]}"}

  seed:
    needs: platforms
    if: ${{ !cancelled() && needs.platforms.result == 'success' && needs.platforms.outputs.seed_count != '0' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.seed) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          # The seed carries a Git bundle of this history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      # Every sealed version carries the embedded Tailscale sidecar (bin/openprogram-tailnet).
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/tailnet/go.mod
          cache-dependency-path: apps/tailnet/go.sum
      - name: Verify version
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Confirm zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            case "${{ matrix.platform }}" in
              linux) sudo apt-get update && sudo apt-get install --no-install-recommends --yes zstd ;;
              macos) brew install zstd ;;
              windows) choco install zstandard --yes --no-progress ;;
            esac
          fi
          zstd --version
      - name: Prepare static OpenSSL for the Intel Mac base
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: scripts/release/prepare-macos-native-deps.sh
      - name: Check the first install with a small seed
        if: matrix.platform != 'windows'
        run: bash scripts/release/smoke-thin-shell.sh
      - name: Prepare macOS signing keychain
        if: matrix.signing == 'signed'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/ci-sign-macos.py setup
      - name: Build the seed
        env:
          OPENPROGRAM_RELEASE_SIGN_IDENTITY: ${{ matrix.signing == 'signed' && vars.MAC_SIGNING_IDENTITY || '' }}
        run: bash scripts/release/build-release-seed.sh "$RUNNER_TEMP/seed-build"
      - name: Remove macOS signing keychain
        if: always() && matrix.signing == 'signed'
        run: python scripts/release/ci-sign-macos.py cleanup
      # A tar keeps the launcher's mode and the helper's links, which an
      # Actions artifact would lose.
      - name: Pack the seed for the App build
        run: |
          mkdir -p "$RUNNER_TEMP/seed-artifact"
          cd "$RUNNER_TEMP/seed-build/seed"
          COPYFILE_DISABLE=1 tar -cf "../seed-${{ matrix.platform }}-${{ matrix.arch }}.tar" .
      - uses: actions/upload-artifact@v7
        with:
          name: seed-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/seed-build/seed-${{ matrix.platform }}-${{ matrix.arch }}.tar
      - name: Pack the command-line seed
        if: matrix.cli_asset == 'true'
        run: |
          name="OpenProgram-${RELEASE_TAG#v}-seed-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          cd "$RUNNER_TEMP/seed-build/cli"
          COPYFILE_DISABLE=1 tar -czf "../$name" seed
          cd ..
          python -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest() + "  " + sys.argv[1])' "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        if: matrix.cli_asset == 'true'
        with:
          name: cli-seed-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/seed-build/OpenProgram-*-seed-*

  desktop:
    needs: [platforms, product-runtime, seed]
    if: ${{ !cancelled() && needs.platforms.result == 'success' && needs.platforms.outputs.desktop_count != '0' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    env:
      THIN_CONFIG: ${{ matrix.layout == 'thin' && '--config build/thin-shell.json' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v8
        if: matrix.layout == 'full'
        with:
          name: product-runtime-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - uses: actions/download-artifact@v8
        if: matrix.layout == 'thin'
        with:
          name: seed-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: seed-artifact
      - name: Verify version
        shell: bash
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Show the Windows toolchain
        if: matrix.platform == 'win'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/release/show-windows-toolchain.ps1
      - name: Prepare native Windows ARM64 OpenSSL
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        shell: pwsh
        run: scripts/release/prepare-windows-native-deps.ps1 -Architecture arm64
      # A failure keeps only this Windows package out (the gate before the
      # upload); the installer is still built and smoke-tested, so one run
      # reports both.
      - name: Windows platform contracts
        id: contracts
        if: matrix.platform == 'win'
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          uv sync --locked --extra dev
          if ($LASTEXITCODE -ne 0) { throw "uv sync exited with code $LASTEXITCODE" }
          $Tests = @(Get-Content -LiteralPath scripts/release/windows-contracts.txt |
            Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith("#") } |
            ForEach-Object { $_.Trim() })
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\windows-diagnostics" | Out-Null
          uv run --locked --extra dev python -m pytest -q -rfEs `
            --junitxml "$env:RUNNER_TEMP\windows-diagnostics\windows-contracts.xml" @Tests
          if ($LASTEXITCODE -ne 0) { throw "the Windows platform contracts failed" }
      - name: Install desktop dependencies
        run: npm ci --workspace apps/desktop --include-workspace-root
      - name: Prepare embedded runtime from release archive
        if: matrix.platform == 'mac' && matrix.layout == 'full'
        shell: bash
        run: |
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" scripts/release/prepare-desktop-runtime.sh
      - name: Unpack the seed and write the thin shell configuration
        if: matrix.layout == 'thin'
        shell: bash
        run: |
          mkdir -p apps/desktop/build/seed
          tar -xf seed-artifact/seed-${{ matrix.runtime_platform }}-${{ matrix.arch }}.tar -C apps/desktop/build/seed
          cd apps/desktop
          python ../../scripts/release/thin-shell-config.py build/thin-shell.json build/seed
      - name: Build staged macOS application
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run icon:check
          npx electron-builder --mac --dir --${{ matrix.builder_arch }} --publish never $THIN_CONFIG
      - name: Prepare macOS signing keychain
        if: matrix.platform == 'mac' && matrix.signing == 'signed'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/release/ci-sign-macos.py setup
      - name: Sign and notarize macOS artifacts
        if: matrix.platform == 'mac' && matrix.signing == 'signed'
        env:
          OPENPROGRAM_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
        run: |
          app="$(find apps/desktop/dist -maxdepth 2 -name OpenProgram.app -type d -print -quit)"
          test -n "$app"
          python3 scripts/release/ci-sign-macos.py sign --app "$app" --output apps/desktop/dist --arch ${{ matrix.builder_arch }}
      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'mac' && matrix.signing == 'signed'
        run: python3 scripts/release/ci-sign-macos.py cleanup
      - name: Ad-hoc sign unsigned macOS artifacts
        if: matrix.platform == 'mac' && matrix.signing == 'unsigned'
        run: |
          app="$(find apps/desktop/dist -maxdepth 2 -name OpenProgram.app -type d -print -quit)"
          test -n "$app"
          python3 scripts/release/ci-sign-macos.py adhoc --app "$app" --output apps/desktop/dist --arch ${{ matrix.builder_arch }}
      - name: Build Windows installer
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.signing == 'signed' && 'true' || 'false' }}
        run: |
          npx electron-builder --win nsis --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with code $LASTEXITCODE" }
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SIGNING: ${{ matrix.signing }}
        run: |
          $Unpacked = Get-ChildItem -LiteralPath apps/desktop/dist -Directory |
            Where-Object { $_.Name -match '^win(?:-arm64)?-unpacked$' } |
            Select-Object -First 1
          if (-not $Unpacked) { throw "unpacked Windows application is missing" }
          $Files = @(
            Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File
            Get-ChildItem -LiteralPath $Unpacked.FullName -Filter "OpenProgram.exe" -File
          )
          if ($Files.Count -lt 2) { throw "installer or application executable is missing" }
          foreach ($File in $Files) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $File.FullName
            if ($env:SIGNING -eq "signed") {
              if ($Signature.Status -ne "Valid" -or -not $Signature.SignerCertificate) {
                throw "invalid Authenticode signature: $($File.FullName) ($($Signature.Status))"
              }
            } elseif ($Signature.Status -ne "NotSigned") {
              # An unsigned build must be plainly unsigned; a broken signature means it was altered.
              throw "unsigned build has a damaged signature: $($File.FullName) ($($Signature.Status))"
            }
          }
      - name: Name the unsigned Windows installer
        if: matrix.platform == 'win' && matrix.signing == 'unsigned'
        shell: pwsh
        run: |
          # Listed in full first: a renamed file still matches the filter and
          # must not be picked up again while the folder is being read.
          @(Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File) |
            Where-Object { $_.BaseName -notlike "*-unsigned" } |
            ForEach-Object { Rename-Item -LiteralPath $_.FullName -NewName ($_.BaseName + "-unsigned.exe") }
      - name: Check the Windows seed is in the App
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $Unpacked = Get-ChildItem -LiteralPath apps/desktop/dist -Directory |
            Where-Object { $_.Name -match '^win(?:-arm64)?-unpacked$' } |
            Select-Object -First 1
          foreach ($Name in "seed.json", "base.tar.zst", "version.tar.zst", "repo.bundle", "openprogram-launcher.exe") {
            if (-not (Test-Path -LiteralPath (Join-Path $Unpacked.FullName "resources\seed\$Name") -PathType Leaf)) {
              throw "the seed in the Windows App is missing $Name"
            }
          }
      # What a new user does with the installer, on this runner: install,
      # first launch to a healthy worker, one real tool call through it, and
      # an uninstall that keeps the data. A failure keeps this App out, as
      # the macOS and Linux checks below do for theirs.
      - name: Verify the Windows App
        if: matrix.platform == 'win'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $Installer = (Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File |
            Select-Object -First 1).FullName
          if (-not $Installer) { throw "the Windows installer is missing" }
          ./scripts/release/smoke-windows-desktop.ps1 -Installer $Installer `
            -ExpectedVersion $env:RELEASE_TAG.Substring(1) -ToolCall -Uninstall `
            -LogDirectory "$env:RUNNER_TEMP\windows-diagnostics\app-smoke"
      - name: Keep the Windows App out when its contracts failed
        if: matrix.platform == 'win' && steps.contracts.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The Windows platform contracts failed (see that step and the diagnostics-windows-desktop artifact), so this App is not uploaded."
          exit 1
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zstd
          # electron-builder's own fpm only runs on x86_64.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install --no-install-recommends --yes ruby ruby-dev build-essential
            sudo gem install fpm --no-document
            echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fi
      - name: Build Linux deb package
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux deb --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
      # A failed AppImage must not cost the deb: the leg ships what it built and
      # the release notes say the AppImage is missing.
      - name: Build Linux AppImage
        id: appimage
        if: matrix.platform == 'linux'
        continue-on-error: true
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
      - name: Discard an incomplete AppImage
        if: matrix.platform == 'linux' && steps.appimage.outcome == 'failure'
        run: rm -f apps/desktop/dist/*.AppImage
      - name: Verify embedded complete runtime
        if: matrix.platform == 'mac'
        run: scripts/release/smoke-packaged-runtime.sh mac apps/desktop/dist
      - name: Verify the Linux App in clean Ubuntu containers
        if: matrix.platform == 'linux'
        run: bash scripts/release/smoke-linux-desktop.sh apps/desktop/dist "${{ matrix.arch }}"
      # The App exactly as users install it: the notarized bundle out of its
      # .zip, the signed install folder the NSIS installer copies, or the
      # AppImage. Only a signed, thin macOS App replaces itself; a deb keeps
      # its installer, since only root writes /opt.
      - name: Upload the App's shell layer
        if: (matrix.platform == 'mac' && matrix.layout == 'thin' && matrix.signing == 'signed') || (matrix.platform == 'win' && matrix.arch == 'x86_64') || matrix.platform == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed=()
          if [ "${{ matrix.platform }}" = mac ]; then
            archive="$(find apps/desktop/dist -maxdepth 1 -name 'OpenProgram-*-mac-*.zip' ! -name '*-unsigned.zip' -print -quit)"
            test -n "$archive"
            unpacked="$RUNNER_TEMP/shell-app"
            rm -rf "$unpacked" && mkdir -p "$unpacked"
            ditto -x -k "$archive" "$unpacked"
            app="$unpacked/OpenProgram.app"
            codesign --verify --deep --strict "$app"
          elif [ "${{ matrix.platform }}" = win ]; then
            app="apps/desktop/dist/win-unpacked"
            test -f "$app/OpenProgram.exe"
          else
            app="$(find apps/desktop/dist -maxdepth 1 -name 'OpenProgram-*.AppImage' -print -quit)"
            if [ -z "$app" ]; then
              # The AppImage is optional: without it this platform has no shell
              # layer, announce does not ask for one, and its users keep the installer.
              echo "::notice::No AppImage was built, so no shell layer for linux-${{ matrix.arch }}"
              exit 0
            fi
            seed=(--seed apps/desktop/build/seed)
          fi
          uv run --no-project --python 3.12 --with zstandard --with cryptography \
            python scripts/release/publish-updates.py upload-shell-layer \
            --app "$app" --platform "${{ matrix.runtime_platform }}-${{ matrix.arch }}" "${seed[@]}" \
            ${{ inputs.rehearse && '--no-upload' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.layout }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/OpenProgram-*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
      # The contracts' report and the App smoke's logs, kept whenever the leg
      # failed or its contracts did, so one run is enough to diagnose it.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.platform == 'win' && (failure() || steps.contracts.outcome == 'failure') }}
        with:
          name: diagnostics-windows-desktop-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-diagnostics
          if-no-files-found: ignore

  cli-installer:
    needs: [platforms, product-runtime]
    if: ${{ !cancelled() && needs.platforms.result == 'success' && !inputs.runtime_layers_only }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v6
        if: matrix.platform == 'windows'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Install the same complete runtime archive
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          OPENPROGRAM_VERSION="$version" \
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" \
          OPENPROGRAM_STATE_DIR="$RUNNER_TEMP/openprogram-state" \
          OPENPROGRAM_BIN_DIR="$RUNNER_TEMP/openprogram-bin" \
            scripts/install-release.sh
          "$RUNNER_TEMP/openprogram-bin/openprogram" --version
      # A server or container has none of Chromium's system libraries; the
      # install must still finish there and leave a working command.
      - name: Install on a bare Linux system
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          bash scripts/release/smoke-linux-bare-install.sh "$archive" "${RELEASE_TAG#v}"
      # Windows PowerShell 5.1, because that is what the public installer hands off to.
      - name: Install the same complete Windows runtime archive
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $env:OPENPROGRAM_VERSION = $env:RELEASE_TAG.Substring(1)
          $env:OPENPROGRAM_RUNTIME_ARCHIVE = (
            Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\runtime-artifact" -Filter "*.zip" |
            Select-Object -First 1
          ).FullName
          $env:OPENPROGRAM_STATE_DIR = "$env:RUNNER_TEMP\openprogram-state"
          $env:OPENPROGRAM_BIN_DIR = "$env:RUNNER_TEMP\openprogram-bin"
          scripts/install-release.ps1
          & "$env:RUNNER_TEMP\openprogram-bin\openprogram.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "the installed command does not run" }
          # One real tool call through the installed command, in the shell it resolves.
          python scripts/release/smoke-tool-call.py `
            --openprogram "$env:RUNNER_TEMP\openprogram-bin\openprogram.cmd" `
            --home "$env:RUNNER_TEMP\openprogram-home"
          if ($LASTEXITCODE -ne 0) { throw "one tool call through the installed command failed" }
      # The publish job ships only runtimes that got this far.
      - name: Record the verified install
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-verified"
          date -u > "$RUNNER_TEMP/cli-verified/verified.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-verified-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cli-verified/verified.txt
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && matrix.platform == 'windows' }}
        with:
          name: diagnostics-windows-cli-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/openprogram-home/.openprogram/**/*.log
            ${{ runner.temp }}/openprogram-state/**/*.log
          if-no-files-found: ignore

  publish:
    needs: [office, platforms, python, product-runtime, seed, desktop, cli-installer]
    # A failed platform leaves its files out; only this job's own checks refuse.
    # The platforms job runs only after the Office archive was found.
    if: ${{ !cancelled() && needs.platforms.result == 'success' && !inputs.runtime_layers_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Check release notes
        run: |
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          release_version="${RELEASE_TAG#v}"
          test -s "$notes_file" || {
            echo "missing release notes: $notes_file" >&2
            exit 1
          }
          python - "$notes_file" "$release_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          notes_path = Path(sys.argv[1])
          version = sys.argv[2]
          notes = notes_path.read_text(encoding="utf-8")
          expected_heading = f"# OpenProgram {version} Release Notes\n"
          if not notes.startswith(expected_heading):
              raise SystemExit(f"invalid release notes heading: {notes_path}")
          if re.search(r"[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]", notes):
              raise SystemExit(f"release notes must be English: {notes_path}")
          PY
      - name: Assemble what this release carries
        env:
          RELEASE_PLAN: ${{ needs.platforms.outputs.plan }}
        run: |
          python scripts/release/release-matrix.py assemble release-artifacts \
            --version "$RELEASE_TAG" \
            --plan "$RELEASE_PLAN" \
            --notes ".github/release-notes/$RELEASE_TAG.md" \
            --notes-output "$RUNNER_TEMP/release-notes.md" \
            --incomplete-output "$RUNNER_TEMP/release-incomplete.txt"
      - name: Create release manifest
        run: |
          python scripts/release/create-release-manifest.py release-artifacts \
            --version "$RELEASE_TAG" \
            --output release-artifacts/release-manifest.json
      - name: Publish GitHub Release
        if: ${{ !inputs.rehearse }}
        run: |
          final_notes="$RUNNER_TEMP/release-notes.md"
          release_version="${RELEASE_TAG#v}"
          # Each file once, under its versioned name; release-manifest.json lists them all.
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || {
              echo "refusing to overwrite a public release: $RELEASE_TAG" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --title "OpenProgram $release_version Release" --notes-file "$final_notes"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag \
              --title "OpenProgram $release_version Release" \
              --notes-file "$final_notes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify public latest Release entry
        if: ${{ !inputs.rehearse }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          office="$(python scripts/release/office-archive.py name)"
          for attempt in $(seq 1 12); do
            if curl --disable --proto '=https' --tlsv1.2 -fsS \
              --connect-timeout 5 --max-time 15 --max-filesize 2097152 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'User-Agent: OpenProgram-release-gate' \
              "$api" > latest.json; then
              tag="$(jq -r '.tag_name // empty' latest.json)"
              draft="$(jq -r '.draft' latest.json)"
              prerelease="$(jq -r '.prerelease' latest.json)"
              manifest_count="$(jq '[.assets[] | select(.name == "release-manifest.json")] | length' latest.json)"
              # The installed App downloads Office from this exact file of its release.
              office_count="$(jq --arg name "$office" '[.assets[] | select(.name == $name)] | length' latest.json)"
              if [ "$tag" = "$RELEASE_TAG" ] && \
                 [ "$draft" = false ] && [ "$prerelease" = false ] && \
                 [ "$manifest_count" = 1 ] && [ "$office_count" = 1 ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "public latest Release did not expose the complete $RELEASE_TAG release" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: List what a release of this commit would carry
        if: ${{ inputs.rehearse }}
        run: |
          {
            echo "### Rehearsal of $RELEASE_TAG at $(git rev-parse --short HEAD): nothing was published"
            echo
            echo '```'
            find release-artifacts -type f -printf '%12s  %f\n' | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The release above is public with what was built. This step makes the
      # job red and names each planned package that is not in it.
      - name: Check every planned package is in the release
        run: |
          incomplete="$RUNNER_TEMP/release-incomplete.txt"
          if [ -s "$incomplete" ]; then
            {
              echo "### Planned for $RELEASE_TAG but not in the release"
              echo
              sed 's/^/- /' "$incomplete"
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/::error::Not in this release: /' "$incomplete"
            exit 1
          fi
