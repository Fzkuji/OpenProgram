name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python scripts/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Build developer Python distributions
        run: |
          scripts/stage-release-assets.sh
          uv build
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/webui/_frontend/index.html'
          uv run --with "$(find dist -name 'openprogram-*.whl' -print -quit)" --no-project -- python -c 'import openprogram.webui.server; from openprogram.webui.frontend import out_dir; assert (out_dir() / "index.html").is_file()'
      - uses: actions/upload-artifact@v7
        with:
          name: developer-python-distributions
          path: dist/*

  product-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python3 scripts/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Install Linux runtime test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1 libglib2.0-0
      - name: Build complete product runtime
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a scripts/build-product-runtime.sh
          else
            scripts/build-product-runtime.sh
          fi
      - name: Archive complete product runtime
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        run: scripts/archive-product-runtime.sh
      - uses: actions/upload-artifact@v7
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/*

  desktop:
    needs: product-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            runtime_platform: macos
            arch: arm64
            builder_arch: arm64
          - runner: macos-15-intel
            platform: mac
            runtime_platform: macos
            arch: x86_64
            builder_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Verify version
        run: python3 scripts/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Prepare embedded runtime from release archive
        shell: bash
        run: |
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" scripts/prepare-desktop-runtime.sh
      - name: Build explicitly unsigned macOS artifacts
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run icon:build
          npm run icon:check
          npx electron-builder --mac dmg zip --${{ matrix.builder_arch }} --publish never
          for artifact in dist/*.dmg dist/*.zip; do
            extension="${artifact##*.}"
            mv "$artifact" "${artifact%.*}-unsigned.$extension"
          done
      - name: Verify embedded complete runtime
        run: scripts/smoke-packaged-runtime.sh mac desktop/dist
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd desktop/dist
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS-*

  cli-installer:
    needs: product-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Install the same complete runtime archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          OPENPROGRAM_VERSION="$version" \
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" \
          OPENPROGRAM_STATE_DIR="$RUNNER_TEMP/openprogram-state" \
          OPENPROGRAM_BIN_DIR="$RUNNER_TEMP/openprogram-bin" \
            scripts/install-release.sh
          "$RUNNER_TEMP/openprogram-bin/openprogram" --version

  publish:
    needs: [python, product-runtime, desktop, cli-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Create release manifest
        run: |
          python scripts/create-release-manifest.py release-artifacts \
            --version "$GITHUB_REF_NAME" \
            --output release-artifacts/release-manifest.json
      - name: Publish GitHub Release
        run: |
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          release_version="${GITHUB_REF_NAME#v}"
          test -s "$notes_file" || {
            echo "missing release notes: $notes_file" >&2
            exit 1
          }
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "OpenProgram $release_version Release" \
            --notes-file "$notes_file"
        env:
          GH_TOKEN: ${{ github.token }}
