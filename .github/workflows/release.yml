name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python scripts/release/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Build developer Python distributions
        run: |
          scripts/release/stage-release-assets.sh
          rm -rf build
          uv build
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram_server/_webui/_frontend/index.html'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram_server/server.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram_server/_webui/routes/tree.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram_server/_webui/ws_actions/webtab.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram_cli/_impl/application.py'
          wheel_path="$(realpath "$(find dist -name 'openprogram-*.whl' -print -quit)")"
          checkout_path="$GITHUB_WORKSPACE"
          probe_dir="$(mktemp -d)"
          (cd "$probe_dir" && OPENPROGRAM_CHECKOUT="$checkout_path" uv run --with "$wheel_path" --no-project -- python -P -c 'from pathlib import Path; import os, openprogram, openprogram_cli, openprogram.cli as legacy_cli, openprogram_server.server as canonical; import openprogram.webui.server as legacy; import openprogram.webui.frontend as frontend; checkout = Path(os.environ["OPENPROGRAM_CHECKOUT"]).resolve(); modules = (openprogram, openprogram_cli, canonical, legacy, frontend); assert canonical is legacy; assert openprogram_cli.main is legacy_cli.main; assert all(not Path(module.__file__).resolve().is_relative_to(checkout) for module in modules); assert (frontend.out_dir() / "index.html").is_file(); assert openprogram_cli.build_parser().prog == "openprogram"')
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram.cli --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram_cli --version)
      - uses: actions/upload-artifact@v7
        with:
          name: developer-python-distributions
          path: dist/*

  product-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python3 scripts/release/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Install Linux runtime test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1 libglib2.0-0
      - name: Build complete product runtime
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a scripts/release/build-product-runtime.sh
          else
            scripts/release/build-product-runtime.sh
          fi
      - name: Archive complete product runtime
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        run: scripts/release/archive-product-runtime.sh
      - uses: actions/upload-artifact@v7
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/*

  desktop:
    needs: product-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            runtime_platform: macos
            arch: arm64
            builder_arch: arm64
          - runner: macos-15-intel
            platform: mac
            runtime_platform: macos
            arch: x86_64
            builder_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Verify version
        run: python3 scripts/release/verify-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Install desktop dependencies
        run: npm ci --workspace apps/desktop --include-workspace-root
      - name: Prepare embedded runtime from release archive
        shell: bash
        run: |
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" scripts/release/prepare-desktop-runtime.sh
      - name: Build explicitly unsigned macOS artifacts
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run icon:check
          npx electron-builder --mac dmg zip --${{ matrix.builder_arch }} --publish never
          for artifact in dist/*.dmg dist/*.zip; do
            extension="${artifact##*.}"
            mv "$artifact" "${artifact%.*}-unsigned.$extension"
          done
      - name: Verify embedded complete runtime
        run: scripts/release/smoke-packaged-runtime.sh mac apps/desktop/dist
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd apps/desktop/dist
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/SHA256SUMS-*

  cli-installer:
    needs: product-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Install the same complete runtime archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          OPENPROGRAM_VERSION="$version" \
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" \
          OPENPROGRAM_STATE_DIR="$RUNNER_TEMP/openprogram-state" \
          OPENPROGRAM_BIN_DIR="$RUNNER_TEMP/openprogram-bin" \
            scripts/install-release.sh
          "$RUNNER_TEMP/openprogram-bin/openprogram" --version

  publish:
    needs: [python, product-runtime, desktop, cli-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Create release manifest
        run: |
          python scripts/release/create-release-manifest.py release-artifacts \
            --version "$GITHUB_REF_NAME" \
            --output release-artifacts/release-manifest.json
      - name: Publish GitHub Release
        run: |
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          release_version="${GITHUB_REF_NAME#v}"
          test -s "$notes_file" || {
            echo "missing release notes: $notes_file" >&2
            exit 1
          }
          python - "$notes_file" "$release_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          notes_path = Path(sys.argv[1])
          version = sys.argv[2]
          notes = notes_path.read_text(encoding="utf-8")
          expected_heading = f"# OpenProgram {version} Release Notes\n"
          if not notes.startswith(expected_heading):
              raise SystemExit(f"invalid release notes heading: {notes_path}")
          if re.search(r"[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]", notes):
              raise SystemExit(f"release notes must be English: {notes_path}")
          PY
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "OpenProgram $release_version Release" \
            --notes-file "$notes_file"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify public latest Release entry
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          for attempt in $(seq 1 12); do
            if curl --disable --proto '=https' --tlsv1.2 -fsS \
              --connect-timeout 5 --max-time 15 --max-filesize 2097152 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'User-Agent: OpenProgram-release-gate' \
              "$api" > latest.json; then
              tag="$(jq -r '.tag_name // empty' latest.json)"
              draft="$(jq -r '.draft' latest.json)"
              prerelease="$(jq -r '.prerelease' latest.json)"
              manifest_count="$(jq '[.assets[] | select(.name == "release-manifest.json")] | length' latest.json)"
              if [ "$tag" = "$GITHUB_REF_NAME" ] && \
                 [ "$draft" = false ] && [ "$prerelease" = false ] && \
                 [ "$manifest_count" = 1 ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "public latest Release did not expose the complete $GITHUB_REF_NAME release" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
