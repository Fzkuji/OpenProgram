<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-label="一份 agentic_function 文件,三种调用方式:聊天、命令行、import">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1440" height="800" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="48" y="68" font-family="-apple-system, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#1f2937">一份函数，三种调用</text>

  <!-- 热加载标签 -->
  <rect x="48" y="176" width="426" height="40" rx="20" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="261" y="202" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#059669">file watcher 热加载 · 无注册 · 无重启</text>
  <line x1="261" y1="216" x2="261" y2="248" stroke="#6ee7b7" stroke-width="1.5"/>

  <!-- 文件卡 -->
  <rect x="48" y="248" width="576" height="224" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="76" y="292" font-family="Menlo, monospace" font-size="17" fill="#6b7280">openprogram/functions/agentics/triage/__init__.py</text>
  <line x1="76" y1="312" x2="596" y2="312" stroke="#93c5fd" stroke-width="1"/>
  <text x="76" y="352" font-family="Menlo, monospace" font-size="17" fill="#2563eb">@agentic_function</text>
  <text x="76" y="384" font-family="Menlo, monospace" font-size="17" fill="#1f2937">def triage(ticket: str, runtime=None) -&gt; str:</text>
  <text x="117" y="416" font-family="Menlo, monospace" font-size="17" fill="#6b7280">"""Classify the ticket, draft a reply."""</text>
  <text x="117" y="448" font-family="Menlo, monospace" font-size="17" fill="#6b7280">...</text>

  <!-- 箭头 1: 文件 -> 聊天 -->
  <path d="M 624 312 C 720 312, 700 200, 800 200" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="230" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#6b7280">聊天</text>

  <!-- 箭头 2: 文件 -> 终端 -->
  <path d="M 624 376 C 712 376, 712 392, 800 392" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="366" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#6b7280">命令行</text>

  <!-- 箭头 3: 文件 -> import -->
  <path d="M 624 440 C 720 440, 700 584, 800 584" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="530" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="18" fill="#6b7280">import</text>

  <!-- ① 聊天卡 -->
  <rect x="800" y="128" width="592" height="144" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="828" y="168" font-family="-apple-system, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#1f2937">聊天界面 <tspan fill="#6b7280" font-weight="400" font-size="18">— agent 在对话中按名挑它当工具</tspan></text>
  <rect x="828" y="188" width="256" height="36" rx="18" fill="#f3f4f6"/>
  <text x="844" y="212" font-family="-apple-system, PingFang SC, sans-serif" font-size="17" fill="#1f2937">用户：帮我分诊这条工单</text>
  <text x="828" y="252" font-family="Menlo, monospace" font-size="17" fill="#2563eb">agent → tool: triage(ticket=…)</text>

  <!-- ② 终端卡 -->
  <rect x="800" y="320" width="592" height="144" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="828" y="360" font-family="-apple-system, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#1f2937">终端 <tspan fill="#6b7280" font-weight="400" font-size="18">— headless，可进脚本、进 CI</tspan></text>
  <text x="828" y="404" font-family="Menlo, monospace" font-size="17" fill="#059669">$ openprogram programs run triage \</text>
  <text x="869" y="436" font-family="Menlo, monospace" font-size="17" fill="#059669">--arg ticket="app crashes on login"</text>

  <!-- ③ Python 卡 -->
  <rect x="800" y="512" width="592" height="144" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="828" y="552" font-family="-apple-system, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#1f2937">Python <tspan fill="#6b7280" font-weight="400" font-size="18">— import 当普通函数调</tspan></text>
  <text x="828" y="596" font-family="Menlo, monospace" font-size="17" fill="#1f2937">from openprogram.functions… import triage</text>
  <text x="828" y="628" font-family="Menlo, monospace" font-size="17" fill="#1f2937">triage("app crashes on login")</text>

  <!-- 底注 -->
  <text x="720" y="736" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="19" fill="#6b7280">同一份代码，三份胶水一份都不用写</text>
</svg>
