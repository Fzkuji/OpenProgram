<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1400 640" role="img" aria-label="@agentic_function 解剖：docstring 是 prompt，类型注解是 tool schema，runtime.exec 是可重试 DAG 节点，其余是确定执行的普通 Python">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .t { font-family: -apple-system, "PingFang SC", sans-serif; fill: #1f2937; }
    .sub { font-family: -apple-system, "PingFang SC", sans-serif; fill: #6b7280; font-size: 18px; }
    .code { font-family: Menlo, monospace; font-size: 17px; fill: #1f2937; }
  </style>

  <text x="40" y="64" class="t" font-size="28" font-weight="700">@agentic_function 解剖：一个装饰器，四件事</text>

  <!-- ================= center code card ================= -->
  <rect x="424" y="120" width="580" height="428" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- highlight bars: blue = LLM, green = deterministic -->
  <rect x="436" y="216" width="556" height="66" rx="6" fill="#eff6ff"/>
  <rect x="436" y="284" width="556" height="66" rx="6" fill="#eff6ff"/>
  <rect x="436" y="352" width="556" height="66" rx="6" fill="#ecfdf5"/>
  <rect x="436" y="420" width="556" height="66" rx="6" fill="#eff6ff"/>
  <rect x="436" y="488" width="556" height="32" rx="6" fill="#eff6ff"/>

  <text x="454" y="172" class="code" fill="#7c3aed">@agentic_function</text>
  <text x="454" y="206" class="code">def triage(ticket: str, runtime=None) -&gt; str:</text>
  <text x="454" y="240" class="code" fill="#2563eb">    """Classify the ticket as bug / feature /</text>
  <text x="454" y="274" class="code" fill="#2563eb">    question, then draft a reply."""</text>
  <text x="454" y="308" class="code" fill="#2563eb">    kind = runtime.exec(ticket,</text>
  <text x="454" y="342" class="code" fill="#2563eb">      choices=["bug", "feature", "question"])</text>
  <text x="454" y="376" class="code" fill="#059669">    if kind == "bug":</text>
  <text x="454" y="410" class="code" fill="#059669">        logs = search_logs(ticket)</text>
  <text x="454" y="444" class="code" fill="#2563eb">        return runtime.exec(</text>
  <text x="454" y="478" class="code" fill="#2563eb">            f"Reply using:\n{logs}")</text>
  <text x="454" y="512" class="code" fill="#2563eb">    return runtime.exec("Draft a short reply.")</text>

  <!-- ================= left cards ================= -->
  <!-- type annotation card -> signature line -->
  <rect x="40" y="146" width="324" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="202" y="190" class="t" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">类型注解 = tool schema</text>
  <text x="202" y="222" class="sub" text-anchor="middle">ticket: str 自动生成</text>
  <text x="202" y="248" class="sub" text-anchor="middle">参数 JSON，无需手写</text>
  <line x1="364" y1="205" x2="414" y2="201" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- docstring card -> docstring rows -->
  <rect x="40" y="330" width="324" height="118" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="202" y="374" class="t" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">docstring = 系统 prompt</text>
  <text x="202" y="406" class="sub" text-anchor="middle">函数说明直接作为 prompt，</text>
  <text x="202" y="432" class="sub" text-anchor="middle">不再维护模板字符串</text>
  <line x1="364" y1="378" x2="414" y2="256" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= right cards ================= -->
  <!-- runtime.exec card -> exec rows -->
  <rect x="1066" y="146" width="300" height="252" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1216" y="184" class="t" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">runtime.exec()</text>
  <text x="1216" y="212" class="t" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">= 可重试 DAG 节点</text>
  <rect x="1096" y="238" width="240" height="44" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1216" y="266" class="t" font-size="18" fill="#2563eb" text-anchor="middle">答案不合法 → 打回重答</text>
  <path d="M 1320 284 C 1320 316 1112 316 1112 288" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1216" y="348" class="sub" font-size="16" text-anchor="middle" fill="#2563eb">代码门控 choices=[…]</text>
  <text x="1216" y="378" class="sub" text-anchor="middle">拿到手的值一定合法</text>
  <line x1="1066" y1="272" x2="1014" y2="316" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- plain python card -> if row -->
  <rect x="1066" y="430" width="300" height="118" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1216" y="474" class="t" font-size="20" font-weight="700" fill="#059669" text-anchor="middle">普通 Python，确定执行</text>
  <text x="1216" y="506" class="sub" text-anchor="middle">if / for / return 每次必跑，</text>
  <text x="1216" y="532" class="sub" text-anchor="middle">模型没有跳过的选项</text>
  <line x1="1066" y1="482" x2="1014" y2="390" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="424" y="580" width="22" height="22" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="456" y="597" class="sub">LLM 相关（可重试节点）</text>
  <rect x="704" y="580" width="22" height="22" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="736" y="597" class="sub">确定性代码（每次执行）</text>
</svg>
