<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" role="img" aria-label="同一个分诊agent的两种写法:常规写法的四个部件在函数写法里各有位置" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1400" height="740" fill="#ffffff"/>

  <!-- Left card -->
  <rect x="40" y="90" width="520" height="610" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="70" y="138" font-size="22" font-weight="700" fill="#1f2937">常规写法：四个部件分开维护</text>

  <!-- L1 -->
  <rect x="70" y="164" width="460" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="94" y="196" font-size="18" font-weight="600" fill="#1f2937">工具schema</text>
  <text x="94" y="226" font-size="15" font-family="Menlo, monospace" fill="#6b7280">TOOLS = [{"type": "function", …}]</text>

  <!-- L2 -->
  <rect x="70" y="274" width="460" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="94" y="306" font-size="18" font-weight="600" fill="#1f2937">prompt模板字符串</text>
  <text x="94" y="336" font-size="15" font-family="Menlo, monospace" fill="#6b7280">TRIAGE_PROMPT = """You are…"""</text>

  <!-- L3 -->
  <rect x="70" y="384" width="460" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="94" y="416" font-size="18" font-weight="600" fill="#1f2937">解析返回值</text>
  <text x="94" y="446" font-size="15" font-family="Menlo, monospace" fill="#6b7280">kind = json.loads(resp)["kind"]</text>

  <!-- L4 -->
  <rect x="70" y="494" width="460" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="94" y="526" font-size="18" font-weight="600" fill="#1f2937">重问逻辑</text>
  <text x="94" y="556" font-size="15" font-family="Menlo, monospace" fill="#6b7280">if kind not in (…): 再问一次</text>

  <!-- L bottom -->
  <line x1="300" y1="574" x2="300" y2="606" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="70" y="612" width="460" height="56" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="94" y="646" font-size="15" font-family="Menlo, monospace" fill="#1f2937">resp = client.chat(PROMPT, tools=TOOLS)</text>

  <!-- Right card -->
  <rect x="840" y="90" width="520" height="610" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="870" y="138" font-size="22" font-weight="700" fill="#1f2937">OpenProgram：一个函数</text>
  <text x="870" y="172" font-size="17" font-family="Menlo, monospace" font-weight="700" fill="#059669">@agentic_function</text>

  <!-- R1 signature -->
  <rect x="870" y="184" width="460" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="894" y="216" font-size="15" font-family="Menlo, monospace" fill="#1f2937">def triage(<tspan font-weight="700" fill="#2563eb">ticket: str</tspan>, runtime=None) -&gt; str:</text>

  <!-- R2 docstring -->
  <rect x="870" y="274" width="460" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="894" y="306" font-size="15" font-family="Menlo, monospace" fill="#2563eb">"""Classify the ticket as bug / feature</text>
  <text x="894" y="334" font-size="15" font-family="Menlo, monospace" fill="#2563eb">/ question, then draft a reply."""</text>

  <!-- R3 choices -->
  <rect x="870" y="384" width="460" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="894" y="416" font-size="15" font-family="Menlo, monospace" fill="#1f2937">kind = runtime.exec(ticket,</text>
  <text x="894" y="444" font-size="15" font-family="Menlo, monospace" fill="#1f2937">  <tspan font-weight="700" fill="#2563eb">choices=["bug","feature","question"]</tspan>)</text>

  <!-- R4 framework note -->
  <rect x="870" y="494" width="460" height="80" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="894" y="526" font-size="17" font-weight="600" fill="#2563eb">解析与重问由框架完成</text>
  <text x="894" y="556" font-size="15" fill="#6b7280">回答不合法时，自动带上原因重新询问</text>

  <!-- R5 python -->
  <rect x="870" y="602" width="460" height="76" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="894" y="632" font-size="15" font-family="Menlo, monospace" fill="#059669">if kind == "bug": …        # 普通Python</text>
  <text x="894" y="660" font-size="15" font-family="Menlo, monospace" fill="#059669">return runtime.exec(…)</text>

  <!-- Arrows -->
  <line x1="546" y1="204" x2="852" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="188" font-size="16" fill="#2563eb" text-anchor="middle">写进类型注解</text>

  <line x1="546" y1="314" x2="852" y2="314" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="298" font-size="16" fill="#2563eb" text-anchor="middle">写进docstring</text>

  <line x1="546" y1="424" x2="852" y2="424" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="408" font-size="16" fill="#2563eb" text-anchor="middle">写进choices参数</text>

  <line x1="546" y1="534" x2="852" y2="534" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="518" font-size="16" fill="#2563eb" text-anchor="middle">框架自动接手</text>
</svg>
