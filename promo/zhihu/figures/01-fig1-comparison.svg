<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" role="img" aria-label="同一个分诊 agent,两种写法:常规写法的 prompt、schema、解析在函数写法里各有位置,输入输出与代码自由配合">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: -apple-system, "PingFang SC", sans-serif; fill: #1f2937; }
    .mut { font-family: -apple-system, "PingFang SC", sans-serif; fill: #6b7280; }
    .c   { font-family: Menlo, monospace; font-size: 17px; fill: #1f2937; }
    .cm  { font-family: Menlo, monospace; font-size: 17px; fill: #6b7280; }
  </style>
  <rect width="1400" height="740" fill="#ffffff"/>
  <text x="40" y="56" class="t" font-size="28" font-weight="700">同一个分诊 agent，两种写法</text>

  <!-- 左:常规写法 -->
  <rect x="40" y="100" width="460" height="510" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="140" class="t" font-size="22" font-weight="700">常规写法</text>

  <rect x="64" y="165" width="412" height="95" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="84" y="200" class="t" font-size="19" font-weight="700">tool schema</text>
  <text x="84" y="238" class="cm">TOOLS = [{"type": "function", …}]</text>

  <rect x="64" y="280" width="412" height="95" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="84" y="315" class="t" font-size="19" font-weight="700">prompt 字符串</text>
  <text x="84" y="353" class="cm">TRIAGE_PROMPT = """You are…"""</text>

  <rect x="64" y="395" width="412" height="95" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="84" y="430" class="t" font-size="19" font-weight="700">返回值解析</text>
  <text x="84" y="468" class="cm">kind = json.loads(resp)["kind"]</text>

  <line x1="270" y1="490" x2="270" y2="516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowgray)"/>
  <text x="284" y="512" class="mut" font-size="17">组装调用</text>
  <rect x="64" y="524" width="412" height="60" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="84" y="561" class="cm">client.chat(PROMPT, tools=TOOLS)</text>

  <!-- 右:函数写法 -->
  <text x="760" y="112" class="t" font-size="22" font-weight="700">OpenProgram：一个函数</text>
  <rect x="760" y="124" width="600" height="426" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="784" y="171" class="c" fill="#7c3aed">@agentic_function</text>
  <text x="784" y="203" class="c">def triage(<tspan fill="#2563eb" font-weight="700">ticket: str</tspan>, runtime=None) -&gt; str:</text>
  <rect x="776" y="220" width="568" height="64" rx="6" fill="#eff6ff"/>
  <text x="816" y="244" class="c" fill="#2563eb">"""Classify the ticket as bug / feature /</text>
  <text x="816" y="274" class="c" fill="#2563eb">question, then draft a reply."""</text>
  <rect x="776" y="292" width="568" height="64" rx="6" fill="#eff6ff"/>
  <text x="816" y="316" class="c">kind = runtime.exec(ticket,</text>
  <text x="848" y="346" class="c"><tspan fill="#2563eb" font-weight="700">choices=["bug","feature","question"]</tspan>)</text>
  <rect x="776" y="364" width="568" height="64" rx="6" fill="#ecfdf5"/>
  <text x="816" y="388" class="c" fill="#059669">if kind == "bug":</text>
  <text x="848" y="418" class="c" fill="#059669">logs = search_logs(ticket)</text>
  <rect x="776" y="436" width="568" height="34" rx="6" fill="#eff6ff"/>
  <text x="848" y="460" class="c">return runtime.exec(f"Reply using:\n{logs}")</text>
  <text x="816" y="502" class="c">return runtime.exec("Draft a short reply.")</text>

  <!-- 三条对应箭头 -->
  <line x1="476" y1="212" x2="752" y2="197" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="188" class="t" font-size="18" fill="#2563eb" text-anchor="middle">来自类型注解</text>
  <line x1="476" y1="327" x2="752" y2="250" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="275" class="t" font-size="18" fill="#2563eb" text-anchor="middle">写进 docstring</text>
  <line x1="476" y1="442" x2="752" y2="324" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="372" class="t" font-size="18" fill="#2563eb" text-anchor="middle">变成带 choices 约定的返回值</text>

  <!-- 绿色重点注解 -->
  <rect x="500" y="440" width="236" height="76" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="618" y="471" class="t" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">回答落回变量 kind，</text>
  <text x="618" y="498" class="t" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">直接进 if 分支</text>
  <line x1="740" y1="452" x2="754" y2="416" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <rect x="500" y="560" width="380" height="76" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="690" y="591" class="t" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">前置逻辑 search_logs(ticket) 算好，</text>
  <text x="690" y="618" class="t" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">结果直接拼进模型输入</text>
  <polyline points="656,556 748,522 752,464" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowg)"/>

  <text x="700" y="700" class="mut" font-size="20" text-anchor="middle">模型调用长在代码中间，输入输出两头都能自由配合</text>
</svg>
