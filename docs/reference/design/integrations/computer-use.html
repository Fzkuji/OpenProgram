<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computer Use 设计概览</title>
<style>
  :root{--bg:#15140f;--text:#c4c0b1;--muted:#858173;--title:#f3f0e8;--line:#343126;--accent:#e08a3e;--blue:#5b91f2;--green:#63b15a;--violet:#a679e4;--code:#100f0b}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:1180px;margin:auto;padding:58px 28px 80px}header{padding-bottom:44px}.eyebrow{color:var(--accent);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
  h1{max-width:900px;margin:14px 0 16px;color:var(--title);font-size:44px;line-height:1.15;letter-spacing:-.025em}header p{max-width:820px;margin:0;color:#aaa696;font-size:18px}
  section{padding:44px 0;border-top:1px solid var(--line)}h2{margin:0 0 20px;color:var(--title);font-size:24px}.diagram{overflow-x:auto;background:var(--code)}svg{display:block;width:100%;min-width:900px;height:auto}
  .links{display:flex;flex-wrap:wrap;gap:12px 28px;padding-top:34px;border-top:1px solid var(--line)}a{color:#55bdd6;text-underline-offset:4px}.links a{font-size:14px}
  @media(max-width:760px){main{padding:34px 20px 60px}h1{font-size:33px}header p{font-size:16px}section{padding:34px 0}}
</style>
</head>
<body><main>
  <header>
    <div class="eyebrow">OpenProgram · Computer Use</div>
    <h1>一个浏览器工具，两种执行模式，同一个 Page</h1>
    <p>Agent 始终调用 <code>computer_use</code>；设置决定由 Microsoft Playwright MCP 或 Claude-compatible backend 执行。</p>
  </header>

  <section aria-labelledby="architecture-title">
    <h2 id="architecture-title">系统结构</h2>
    <div class="diagram"><svg viewBox="0 0 1120 440" role="img">
      <title>Computer Use 双模式结构</title><desc>Agent 经 OpenProgram MCP 与 Runtime，选择一个冻结的执行模式，操作当前精确 Page。</desc>
      <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#858173"/></marker><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#5b91f2"/></marker></defs>
      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <rect x="38" y="118" width="176" height="82" rx="8" fill="#151b25" stroke="#5b91f2"/><text x="126" y="151" fill="#5b91f2" font-size="16" font-weight="700" text-anchor="middle">Chat Agent</text><text x="126" y="176" fill="#c4c0b1" font-size="12" text-anchor="middle">computer_use</text>
        <rect x="282" y="106" width="214" height="106" rx="8" fill="#211b12" stroke="#e08a3e"/><text x="389" y="145" fill="#e08a3e" font-size="16" font-weight="700" text-anchor="middle">OpenProgram MCP</text><text x="389" y="174" fill="#c4c0b1" font-size="12" text-anchor="middle">统一工具契约</text>
        <rect x="564" y="92" width="238" height="134" rx="8" fill="#1a1423" stroke="#a679e4"/><text x="683" y="130" fill="#a679e4" font-size="16" font-weight="700" text-anchor="middle">Runtime</text><text x="683" y="159" fill="#c4c0b1" font-size="12" text-anchor="middle">Page binding · permission</text><text x="683" y="183" fill="#c4c0b1" font-size="12" text-anchor="middle">frame · verification</text>
        <line x1="214" y1="159" x2="278" y2="159" stroke="#5b91f2" stroke-width="2" marker-end="url(#blue-arrow)"/><line x1="496" y1="159" x2="560" y2="159" stroke="#858173" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M802 137 H864 V86" fill="none" stroke="#858173" stroke-width="2" marker-end="url(#arrow)"/><path d="M802 182 H864 V257" fill="none" stroke="#858173" stroke-width="2" marker-end="url(#arrow)"/>
        <rect x="870" y="42" width="212" height="92" rx="8" fill="#121d1a" stroke="#63b15a"/><text x="976" y="79" fill="#63b15a" font-size="15" font-weight="700" text-anchor="middle">Playwright MCP</text><text x="976" y="105" fill="#c4c0b1" font-size="12" text-anchor="middle">官方 backend</text>
        <rect x="870" y="216" width="212" height="92" rx="8" fill="#151b25" stroke="#5b91f2"/><text x="976" y="253" fill="#5b91f2" font-size="15" font-weight="700" text-anchor="middle">Claude-compatible</text><text x="976" y="279" fill="#c4c0b1" font-size="12" text-anchor="middle">OpenProgram bridge</text>
        <path d="M976 134 V366 H792" fill="none" stroke="#63b15a" stroke-width="2" marker-end="url(#arrow)"/><path d="M976 308 V366 H792" fill="none" stroke="#5b91f2" stroke-width="2" marker-end="url(#blue-arrow)"/>
        <rect x="466" y="330" width="326" height="72" rx="8" fill="#181b12" stroke="#63b15a"/><text x="629" y="360" fill="#63b15a" font-size="16" font-weight="700" text-anchor="middle">当前精确 Page</text><text x="629" y="383" fill="#c4c0b1" font-size="12" text-anchor="middle">不依赖窗口置前或分屏方向</text>
      </g>
    </svg></div>
  </section>

  <section aria-labelledby="loop-title">
    <h2 id="loop-title">Agent 交互循环</h2>
    <div class="diagram"><svg viewBox="0 0 1120 280" role="img">
      <title>Computer Use 交互循环</title><desc>Page context 先进入 Agent，随后观察、执行单个动作、重新观察并验证。</desc>
      <defs><marker id="orange-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#e08a3e"/></marker></defs>
      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" transform="translate(42,72)">
        <g><rect width="174" height="78" rx="8" fill="#151b25" stroke="#5b91f2"/><text x="87" y="32" fill="#5b91f2" text-anchor="middle" font-size="14" font-weight="700">Page Context</text><text x="87" y="55" fill="#c4c0b1" text-anchor="middle" font-size="11">当前分屏与页面摘要</text></g>
        <g transform="translate(216,0)"><rect width="174" height="78" rx="8" fill="#1a1423" stroke="#a679e4"/><text x="87" y="32" fill="#a679e4" text-anchor="middle" font-size="14" font-weight="700">Observe</text><text x="87" y="55" fill="#c4c0b1" text-anchor="middle" font-size="11">DOM / ARIA / 一张图</text></g>
        <g transform="translate(432,0)"><rect width="174" height="78" rx="8" fill="#171821" stroke="#5b91f2"/><text x="87" y="32" fill="#5b91f2" text-anchor="middle" font-size="14" font-weight="700">Act</text><text x="87" y="55" fill="#c4c0b1" text-anchor="middle" font-size="11">一个页面动作</text></g>
        <g transform="translate(648,0)"><rect width="174" height="78" rx="8" fill="#1a1423" stroke="#a679e4"/><text x="87" y="32" fill="#a679e4" text-anchor="middle" font-size="14" font-weight="700">Observe</text><text x="87" y="55" fill="#c4c0b1" text-anchor="middle" font-size="11">生成新 frame</text></g>
        <g transform="translate(864,0)"><rect width="174" height="78" rx="8" fill="#181b12" stroke="#63b15a"/><text x="87" y="32" fill="#63b15a" text-anchor="middle" font-size="14" font-weight="700">Verify</text><text x="87" y="55" fill="#c4c0b1" text-anchor="middle" font-size="11">Runtime 判定结果</text></g>
        <line x1="174" y1="39" x2="212" y2="39" stroke="#e08a3e" stroke-width="2" marker-end="url(#orange-arrow)"/><line x1="390" y1="39" x2="428" y2="39" stroke="#e08a3e" stroke-width="2" marker-end="url(#orange-arrow)"/><line x1="606" y1="39" x2="644" y2="39" stroke="#e08a3e" stroke-width="2" marker-end="url(#orange-arrow)"/><line x1="822" y1="39" x2="860" y2="39" stroke="#e08a3e" stroke-width="2" marker-end="url(#orange-arrow)"/>
        <text x="519" y="132" fill="#858173" font-size="12" text-anchor="middle">默认 DOM / ARIA；只有视觉任务或 canvas 才发送一张 viewport screenshot</text>
      </g>
    </svg></div>
  </section>

  <footer class="links">
    <a href="computer-use-technical-spec.html">技术规格与实施阶段</a>
    <a href="computer-use-implementation.html">当前实现与验证记录</a>
    <a href="https://github.com/microsoft/playwright-mcp">Microsoft Playwright MCP</a>
    <a href="https://code.claude.com/docs/en/chrome">Claude Code Browser 文档</a>
  </footer>
</main></body>
</html>
