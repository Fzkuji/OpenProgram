<body><h1>Commitments 已迁移到 Scheduler</h1><section><p>Commitments 不再是 Memory 数据类型。Memory writer 不再自动抽取承诺，Memory Web 和 <code>/api/memory/status</code> 不再暴露 Commitments，cron worker 也不再执行专用 heartbeat。</p><p>旧 <code>commitments.jsonl</code> 在 Scheduler 首次启动时迁移为一次性任务或暂停草稿，原始文件移入 Scheduler migration archive。当前设计、接口、失败语义和验收记录见 <a href="../scheduler/scheduler-memory.html">Scheduler 与 Memory 接口</a>。</p></section></body></html>
