    <text x="-40" y="160" font-family="Geist Mono" font-size="13" fill="#9a6b12" text-anchor="middle" transform="rotate(-90,-40,160)">fail &#8594; re-decide</text>

    <path d="M244 197 L286 197" stroke="#2a7a45" stroke-width="2.4" fill="none"/>
    <polygon points="294,197 284,192 284,202" fill="#2a7a45"/>
    <g>
