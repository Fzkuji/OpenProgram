      <rect x="0" y="88" width="230" height="46" rx="10" fill="#e8eef8" stroke="#e8eef8" stroke-width="1.3"/>
      <circle cx="24" cy="111" r="7" fill="#3B9EFF"/>
      <text x="42" y="108" font-family="Instrument Sans" font-weight="700" font-size="14" fill="#3d3d3a">LLM proposes</text>
