    <text x="24" y="26" font-family="Geist Mono" font-size="15" fill="#2a7a45">Code rejects a bad pick</text>
  </g>
  <g transform="translate(559,104)">
    <rect width="479" height="40" rx="10" fill="#f6efe0" stroke="#f6efe0" stroke-width="1.3"/>
