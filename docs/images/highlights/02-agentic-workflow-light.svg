      <text x="316" y="194" font-family="Instrument Sans" font-weight="700" font-size="14" fill="#3d3d3a">resolve</text>
      <text x="316" y="211" font-family="Geist Mono" font-size="12" fill="#73726c">run fn · or return value</text>
    </g>
    <text x="360" y="168" font-family="Geist Mono" font-size="12" fill="#2a7a45">pass</text>
  </g>

