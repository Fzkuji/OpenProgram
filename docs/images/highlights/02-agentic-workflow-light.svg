  <text x="176" y="72" font-family="Instrument Sans" font-weight="700" font-size="36" fill="#3d3d3a">Agentic Workflow</text>

  <g transform="translate(64,104)">
    <rect width="479" height="40" rx="10" fill="#e8f4ec" stroke="#e8f4ec" stroke-width="1.3"/>
