      <text x="13" y="71" font-family="Geist Mono" font-size="10.5" fill="#73726c">@agentic_function</text>
    </g>
    <path d="M140 46 L166 46" stroke="#8A7AB8" stroke-width="2.2" fill="none"/>
    <polygon points="174,46 164,41 164,51" fill="#8A7AB8"/>

    <g>
      <rect x="176" y="16" width="140" height="60" rx="10" fill="#eef4fb" stroke="#d7e8f6" stroke-width="1.3"/>
      <text x="189" y="40" font-family="Instrument Sans" font-weight="700" font-size="14" fill="#1d6fc2">watcher</text>
      <text x="189" y="57" font-family="Geist Mono" font-size="11.5" fill="#73726c">2s poll</text>
      <text x="189" y="71" font-family="Geist Mono" font-size="10.5" fill="#73726c">fingerprint change</text>
