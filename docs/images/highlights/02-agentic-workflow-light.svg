      <rect x="352" y="16" width="140" height="60" rx="10" fill="#eef4fb" stroke="#d7e8f6" stroke-width="1.3"/>
      <text x="365" y="40" font-family="Instrument Sans" font-weight="700" font-size="14" fill="#1d6fc2">rescan</text>
      <text x="365" y="57" font-family="Geist Mono" font-size="11.5" fill="#73726c">import → register</text>
      <text x="365" y="71" font-family="Geist Mono" font-size="10.5" fill="#73726c">additions only</text>
    </g>
    <path d="M492 46 L518 46" stroke="#5A7A9A" stroke-width="2.2" fill="none"/>
    <polygon points="526,46 516,41 516,51" fill="#5A7A9A"/>

    <g>
      <rect x="528" y="16" width="126" height="60" rx="10" fill="#e8f4ec" stroke="#e8f4ec" stroke-width="1.6"/>
      <text x="541" y="40" font-family="Instrument Sans" font-weight="700" font-size="14" fill="#2a7a45">live tool</text>
      <text x="541" y="57" font-family="Geist Mono" font-size="11.5" fill="#2a7a45">next turn,</text>
      <text x="541" y="71" font-family="Geist Mono" font-size="11.5" fill="#2a7a45">callable</text>
    </g>

    <path d="M591 76 C 591 116, 70 116, 70 82" fill="none" stroke="#5AAD4E" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/>
