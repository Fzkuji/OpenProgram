      <text x="34" y="188" font-family="Geist Mono" font-size="15" fill="#2a7a45">code gate: validate</text>
      <text x="34" y="212" font-family="Geist Mono" font-size="12" fill="#2a7a45">unknown_call · missing · type · enum</text>
    </g>

