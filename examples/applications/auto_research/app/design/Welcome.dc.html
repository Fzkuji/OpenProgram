<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>欢迎页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #f5f6f8; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; color: #16181d; display: flex; flex-direction: column">
  <div style="flex: 1 1 auto; display: flex; justify-content: center; padding: 96px 24px 48px">
    <div style="width: 100%; max-width: 920px; display: flex; flex-wrap: wrap; gap: 56px">

      <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #16181d; color: #ffffff; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"></path><path d="M7.5 15h9"></path></svg>
          </div>
          <h1 style="margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.01em">Auto Research</h1>
          <p style="margin: 0; font-size: 15px; line-height: 24px; color: #5b616e">在论文仓库里跑检查、派 agent 修改，再对着 PDF 审阅每一轮改动。</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 12px; font-weight: 600; color: #5b616e; letter-spacing: 0.04em; padding: 0 12px 6px">开始</div>
          <button type="button" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; font-size: 15px; font-weight: 550; text-align: left; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span style="flex: 1 1 auto">打开文件夹…</span>
            <span style="font-size: 13px; opacity: 0.85">⌘O</span>
          </button>
          <button type="button" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #16181d; font: inherit; font-size: 15px; text-align: left; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b616e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path><path d="M8 4v5"></path></svg>
            <span style="flex: 1 1 auto">从 OpenProgram 项目中选</span>
          </button>
        </div>

        <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5b616e">文件夹需要是 Git 仓库。agent 的改动都先放在草稿里，你点「接受」后才写回项目。</p>
      </div>

      <div style="flex: 1.4 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; padding: 0 12px 6px">
          <span style="flex: 1 1 auto; font-size: 12px; font-weight: 600; color: #5b616e; letter-spacing: 0.04em">最近</span>
          <button type="button" style="border: 0; background: transparent; color: #5b616e; font: inherit; font-size: 13px; cursor: pointer">清空</button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 20px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          <span style="flex: 1 1 auto">「Downloads」不是 Git 仓库，没法在里面跑任务。</span>
          <button type="button" style="border: 0; background: transparent; color: #9a3412; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">换一个文件夹</button>
        </div>

        <div style="background: #ffffff; border: 1px solid #e3e5e9; border-radius: 12px; overflow: hidden">
          <button type="button" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; border-bottom: 1px solid #eef0f3; background: #f3f6fd; font: inherit; text-align: left; cursor: pointer">
            <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 8px; background: #eaf1fe; color: #1d4ed8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 650">2N</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2026-NeurIPS-Zichuan-Fu-OpenProgram</span>
              <span style="font-size: 12px; color: #5b616e; font-family: 'SF Mono', Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">~/Projects/…/Papers/2026-NeurIPS-Zichuan-Fu-OpenProgram</span>
            </span>
            <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-size: 12px; color: #374151; background: #eef0f3; border-radius: 4px; padding: 1px 6px; font-family: 'SF Mono', Menlo, monospace">main · 6c99ab3</span>
              <span style="font-size: 12px; color: #5b616e">刚刚</span>
            </span>
          </button>
          <button type="button" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; border-bottom: 1px solid #eef0f3; background: #ffffff; font: inherit; text-align: left; cursor: pointer">
            <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 8px; background: #f0fdf4; color: #15803d; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 650">LU</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600">LLM Uncertainty</span>
              <span style="font-size: 12px; color: #5b616e; font-family: 'SF Mono', Menlo, monospace">~/Projects/…/LLM Uncertainty</span>
            </span>
            <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-size: 12px; color: #374151; background: #eef0f3; border-radius: 4px; padding: 1px 6px; font-family: 'SF Mono', Menlo, monospace">[分支]</span>
              <span style="font-size: 12px; color: #5b616e">[上次打开]</span>
            </span>
          </button>
          <button type="button" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: #ffffff; font: inherit; text-align: left; cursor: pointer">
            <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 8px; background: #faf5ff; color: #7e22ce; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 650">OP</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600">OpenProgram</span>
              <span style="font-size: 12px; color: #5b616e; font-family: 'SF Mono', Menlo, monospace">~/Projects/OpenProgram</span>
            </span>
            <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-size: 12px; color: #374151; background: #eef0f3; border-radius: 4px; padding: 1px 6px; font-family: 'SF Mono', Menlo, monospace">[分支]</span>
              <span style="font-size: 12px; color: #5b616e">[上次打开]</span>
            </span>
          </button>
        </div>
        <p style="margin: 4px 12px 0; font-size: 12px; color: #5b616e">点一行进入项目。鼠标移上去，行尾出现 × 可以从列表里移除（不删文件）。</p>
      </div>

    </div>
  </div>
</div>
</x-dc>

</body>
</html>
