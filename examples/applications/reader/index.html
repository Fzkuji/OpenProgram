<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Paper reader</title><style>body{font:16px system-ui;margin:2rem;max-width:60rem}textarea{display:block;width:100%;height:15rem;font:inherit}button{font:inherit;padding:.6rem;margin:.5rem .5rem .5rem 0}pre{white-space:pre-wrap}output{display:block}</style><h1>Paper reader</h1><label for="text">Paper text and annotations</label><textarea id="text"></textarea><button id="save">Save notes</button><button id="run">Summarize</button><button id="cancel">Cancel run</button><output id="status" aria-live="polite"></output><pre id="result"></pre><script>
const api=window.openprogramApp;
const status=document.getElementById('status'),result=document.getElementById('result');
let active=null,version=0;
async function restore(){try{const saved=await api.load();version=saved.version;document.getElementById('text').value=saved.value.text||'';
const runs=await api.runs();active=runs.find(r=>['queued','running','cancelling'].includes(r.status))?.id;if(active)watch();}catch(e){status.textContent=e.message;}}
async function watch(){try{const run=await api.status(active);status.textContent=run.status+(run.error?' — '+run.error:'');result.textContent=run.result===null?'':JSON.stringify(run.result,null,2);if(['queued','running','cancelling'].includes(run.status))setTimeout(watch,500);}catch(e){status.textContent=e.message;}}
document.getElementById('run').onclick=async()=>{try{const run=await api.run('summarize',{text:document.getElementById('text').value});active=run.id;watch();}catch(e){status.textContent=e.message;}};
document.getElementById('cancel').onclick=async()=>{if(active){try{await api.cancel(active);}catch(e){status.textContent=e.message;}}};
document.getElementById('save').onclick=async()=>{try{const saved=await api.save({text:document.getElementById('text').value},version);version=saved.version;status.textContent='Saved';}catch(e){status.textContent=e.message;}};
restore();</script></html>
