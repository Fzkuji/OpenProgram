<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>File analysis</title><style>body{font:16px system-ui;margin:2rem;max-width:60rem}textarea{display:block;width:100%;height:15rem;font:inherit}button{font:inherit;padding:.6rem;margin:.5rem .5rem .5rem 0}pre{white-space:pre-wrap}output{display:block}</style><h1>File analysis</h1><label for="paths">Project-relative text files, one per line</label><textarea id="paths"></textarea><button id="run">Analyze files</button><button id="cancel">Cancel run</button><output id="status" aria-live="polite"></output><pre id="result"></pre><script>
const api=window.openprogramApp;
const status=document.getElementById('status'),result=document.getElementById('result');
let active=null,version=0;
async function restore(){try{const saved=await api.load();version=saved.version;result.textContent=JSON.stringify(saved.value,null,2);
const runs=await api.runs();active=runs.find(r=>['queued','running','cancelling'].includes(r.status))?.id;if(active)watch();}catch(e){status.textContent=e.message;}}
async function watch(){try{const run=await api.status(active);status.textContent=run.status+(run.error?' — '+run.error:'');result.textContent=run.result===null?'':JSON.stringify(run.result,null,2);if(['queued','running','cancelling'].includes(run.status))setTimeout(watch,500);}catch(e){status.textContent=e.message;}}
document.getElementById('run').onclick=async()=>{try{const run=await api.run('analyze',{paths:document.getElementById('paths').value.split('\n').map(p=>p.trim()).filter(Boolean)});active=run.id;watch();}catch(e){status.textContent=e.message;}};
document.getElementById('cancel').onclick=async()=>{if(active){try{await api.cancel(active);}catch(e){status.textContent=e.message;}}};

restore();</script></html>
