<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>File analysis</title><style>html{color-scheme:light dark;background:Canvas;color:CanvasText}body{font:16px system-ui;margin:2rem;max-width:60rem}textarea{display:block;width:100%;height:15rem;font:inherit}button{font:inherit;padding:.6rem;margin:.5rem .5rem .5rem 0}pre{white-space:pre-wrap}output{display:block}</style><h1>File analysis</h1><label for="paths">Project-relative text files, one per line</label><textarea id="paths"></textarea><button id="run" disabled>Analyze files</button><button id="cancel">Cancel run</button><output id="status" aria-live="polite"></output><pre id="result"></pre><script>
const api=window.openprogramApp;
const status=document.getElementById('status'),result=document.getElementById('result');
let active=null,version=0,cursor=0,progress=null;
async function restore(){try{const saved=await api.load();version=saved.version;result.textContent=JSON.stringify(saved.value,null,2);
const runs=await api.runs();active=(runs.find(r=>['queued','running','cancelling'].includes(r.status))||runs[0])?.id;if(active)watch();else document.getElementById('run').disabled=false;}catch(e){status.textContent=e.message;}}
async function watch(){try{
const run=await api.status(active,cursor);
for(const event of run.events||[]){cursor=Math.max(cursor,event.sequence);if(event.type==='progress')progress=event.value;}
const running=['queued','running','cancelling'].includes(run.status);
document.getElementById('run').disabled=running;
status.textContent=run.status+(progress?' — '+(typeof progress==='string'?progress:JSON.stringify(progress)):'')+(run.error?' — '+run.error:'');
if(run.result!==null)result.textContent=JSON.stringify(run.result,null,2);
else {const saved=await api.load();version=saved.version;if(saved.value.results)result.textContent=JSON.stringify(saved.value.results,null,2);}
if(running)setTimeout(watch,500);
}catch(e){status.textContent=e.message;document.getElementById('run').disabled=false;}}

document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const run=await api.run('analyze',{paths:document.getElementById('paths').value.split('\n').map(p=>p.trim()).filter(Boolean)});active=run.id;cursor=0;progress=null;watch();}catch(e){status.textContent=e.message;document.getElementById('run').disabled=false;}};
document.getElementById('cancel').onclick=async()=>{if(active){try{await api.cancel(active);}catch(e){status.textContent=e.message;}}};

restore();</script></html>
